<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aadhaar Fraud Detection System - Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#eef3ff,#ffffff);

overflow:hidden;

}

/* Background Circles */

.circle1{

position:absolute;

width:350px;

height:350px;

background:#b8c6ff;

border-radius:50%;

top:-120px;

left:-120px;

opacity:.45;

}

.circle2{

position:absolute;

width:260px;

height:260px;

background:#d9ccff;

border-radius:50%;

right:-80px;

bottom:-70px;

opacity:.35;

}

/* Main Container */

.container{

width:1100px;

height:650px;

background:#fff;

border-radius:25px;

box-shadow:0 20px 45px rgba(0,0,0,.12);

display:flex;

overflow:hidden;

animation:fadeIn 1s ease;

position:relative;

}

/* Left Panel */

.left{

width:42%;

background:#f7f9ff;

padding:60px;

display:flex;

flex-direction:column;

justify-content:center;

position:relative;

}

.logo{

width:75px;

height:75px;

border-radius:20px;

background:#ffffff;

display:flex;

justify-content:center;

align-items:center;

font-size:38px;

color:#5b5df0;

box-shadow:0 10px 25px rgba(0,0,0,.08);

margin-bottom:25px;

}

.left h1{

font-size:36px;

color:#23395d;

line-height:48px;

margin-bottom:15px;

}

.subtitle{

color:#5b5df0;

font-weight:600;

margin-bottom:20px;

font-size:18px;

}

.left p{

color:#666;

line-height:28px;

font-size:15px;

margin-bottom:40px;

}

/* Illustration */

.illustration{

width:100%;

display:flex;

justify-content:center;

}

.illustration img{

width:260px;

}

/* Right Panel */

.right{

width:58%;

display:flex;

justify-content:center;

align-items:center;

padding:50px;

}

.login-card{

width:430px;

background:#fff;

padding:40px;

border-radius:18px;

box-shadow:0 15px 40px rgba(0,0,0,.12);

}

.login-card h2{

text-align:center;

font-size:30px;

color:#222;

margin-bottom:10px;

}

.login-card p{

text-align:center;

color:#777;

margin-bottom:35px;

font-size:14px;

}
/* Input Box */

.input-group{

position:relative;

margin-bottom:20px;

}

.input-group i{

position:absolute;

left:15px;

top:17px;

color:#888;

}

.input-group input{

width:100%;

padding:14px 45px;

border:1px solid #ddd;

border-radius:10px;

font-size:15px;

height:45px;

outline:none;

transition:.3s;

}

.input-group input:focus{

border-color:#5b5df0;

box-shadow:0 0 8px rgba(91,93,240,.25);

}

.eye{

position:absolute;

right:15px;

left:auto !important;

top:50%;

transform:translateY(-20%);

cursor:pointer;

color:#666;

z-index:10;

}
/* Remember */

.options{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:25px;

font-size:14px;

}

.options a{

text-decoration:none;

color:#5b5df0;

font-weight:500;

}

/* Login Button */

.login-btn{

width:100%;

padding:14px;

border:none;

border-radius:12px;

background:linear-gradient(90deg,#5b5df0,#7d52ff);

color:white;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.3s;

}

.login-btn:hover{

transform:translateY(-2px);

box-shadow:0 10px 25px rgba(91,93,240,.35);

}

/* Divider */

.divider{

display:flex;

align-items:center;

margin:28px 0;

}

.divider::before,

.divider::after{

content:"";

flex:1;

height:1px;

background:#ddd;

}

.divider span{

padding:0 15px;

color:#777;

font-size:14px;

}

/* Google Button */

.google-btn{

width:100%;

padding:14px;

border:1px solid #ddd;

background:#fff;

border-radius:12px;

cursor:pointer;

font-size:15px;

font-weight:500;

transition:.3s;

}
.google-icon{

width:20px;

height:20px;

margin-right:10px;

vertical-align:middle;

}
.google-btn:hover{

background:#f5f5f5;

}

/* Footer */

.footer{

margin-top:25px;

text-align:center;

font-size:13px;

color:#777;

}

/* Animation */

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="circle1"></div>

<div class="circle2"></div>

<div class="container">

<div class="left">

<div class="logo">

<i class="fa-solid fa-shield-halved"></i>

</div>

<h1>Aadhaar Fraud Detection System</h1>

<div class="subtitle">

Secure Login

</div>

<p>

Monitor Aadhaar verification records,

detect fraud activities,

and access analytics securely through

the administrator dashboard.

</p>

<div class="illustration">

<div style="font-size:120px;text-align:center;">🛡️</div>

</div>

</div>

<div class="right">

<div class="login-card">

<h2>Welcome Back 👋</h2>

<p>Please login to continue</p>

<form action="/index" method="GET">

<div class="input-group">
<i class="fa-solid fa-user"></i>
<input type="text"
name="username"
placeholder="Username"
required>
</div>

<div class="input-group">
<i class="fa-solid fa-lock"></i>

<input type="password"
id="password"
name="password"
placeholder="Password"
required>

<i class="fa-solid fa-eye eye"
id="togglePassword"></i>
</div>

<div class="options">

<label>
<input type="checkbox">
Remember Me
</label>

<a href="#">
Forgot Password?
</a>

</div>

<button type="submit"
class="login-btn">

Login

</button>

<div class="divider">

<span>OR</span>

</div>

<button type="button"
class="google-btn">

<img src="https://www.google.com/favicon.ico"
     class="google-icon">

Continue with Google

</button>

<div class="footer">

Don't have an account?

<a href="#"
style="text-decoration:none;
color:#5b5df0;
font-weight:600;">

Register

</a>

</div>

</form>

</div>

</div>

</div>

<script>

const togglePassword =
document.getElementById("togglePassword");

const password =
document.getElementById("password");

togglePassword.addEventListener("click",function(){

if(password.type==="password"){
password.type="text";

this.classList.remove("fa-eye"); 
this.classList.add("fa-eye-slash");

}
else{

password.type="password";

password.type="password"; 
this.classList.remove("fa-eye-slash"); this.classList.add("fa-eye");

}

});

</script>

</body>

</html>
