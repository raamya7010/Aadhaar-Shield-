<!DOCTYPE html>
<html>
<head>
    <title>My Project</title>
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            display: flex;
        }

        /* Sidebar */
        .sidebar{
            width:240px;
            height:100vh;
            background:linear-gradient(180deg,#1e3c72,#2a5298);
            color:white;
            padding-top:25px;
            position:fixed;
            left:0;
            top:0;
            overflow:hidden;
            box-shadow:4px 0 15px rgba(0,0,0,.2);
        }

       .logo{
    text-align:center;
    margin-bottom:40px;
    padding-top:10px;
}

.logo i{
    display:block;
    font-size:50px;
    color:#60a5fa;
    margin-bottom:12px;
}

.logo span{
    display:block;
    font-size:22px;
    font-weight:700;
    line-height:1.3;
}
            
        .sidebar a{
            display:flex;
            align-items:center;
            gap:12px;
            color:white;
            text-decoration:none;
            padding:15px 22px;
            margin:8px 15px;
            border-radius:10px;
            transition:.3s;
            font-size:16px;
        }

        .sidebar a:hover {
            background:#2563eb;
        }
        .sidebar a.active{
            background:#2563eb;
            color:#fff;
            font-weight:600;
        }

        /* Main content */
        .main {
            flex: 1;
            margin-left:240px;
            padding:30px;
            background:#f4f7fc;
            min-height:100vh;
        }

        .stats-container{
            display:flex;
            gap:20px;
            margin:25px 0;
        }

        .card{
            flex:1;
            padding:25px;
            border-radius:18px;
            background:white;
            color:#222;
            box-shadow:0 8px 25px rgba(0,0,0,.08);
            transition:.3s; 
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .total-card,
        .safe-card,
        .fraud-card{
            background:#ffffff;
            color:#222;
            border-radius:18px;
            padding:22px;
            box-shadow:0 8px 25px rgba(0,0,0,.08);
        }
        .card h3{
            margin:0;
            font-size:18px;
        }

        .card h2{
            margin-top:10px;
            font-size:32px;
        }

        .search-section{
            background:white;
            padding:20px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.08);
            margin-bottom:25px;
        }

        .search-form{
            display:flex;
            gap:15px;
            align-items:center;
            flex-wrap:wrap;
        } 

        .search-form input{
            flex:1;
            padding:12px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:15px;
            outline:none;
        }

        .search-form input:focus{
            border-color:#3498db;
        }

        .search-btn{
            background:#3498db;
            color:white;
            border:none;
            padding:12px 22px;
            border-radius:10px;
            cursor:pointer;
            font-weight:bold;
        }

        .download-btn{
            background:#2ecc71;
            color:white;
            text-decoration:none;
            padding:12px 20px;
            border-radius:10px;
            font-weight:bold;
        }

        .table-container{
            background:#fff;
            padding:20px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,0.08);
            overflow-x:auto;
        }

        .dashboard-table{
            width:100%;
            border-collapse:collapse;
            font-family:Arial,sans-serif;
        }

        .dashboard-table thead{
            background:#2c3e50;
            color:#fff;
        }

        .dashboard-table th,
        .dashboard-table td{
            padding:14px;
            text-align:center;
        }

        .dashboard-table tbody tr{
            border-bottom:1px solid #e5e5e5;
        }

        .dashboard-table tbody tr:nth-child(even){
            background:#f8f9fa;
        }

        .dashboard-table tbody tr:hover{
            background:#eef6ff;
            transition:.3s;
        }

        .status-safe{
            background:#d4edda;
            color:#155724;
            padding:6px 12px;
            border-radius:20px;
            font-weight:bold;
        }

        .status-fraud{
            background:#f8d7da;
            color:#721c24;
            padding:6px 12px;
            border-radius:20px;
            font-weight:bold;
        }

        .risk-low{
            background:#d4edda;
            color:#155724;
            padding:6px 12px;
            border-radius:20px;
            font-weight:bold;
        }

        .risk-high{
            background:#f8d7da;
            color:#721c24;
            padding:6px 12px;
            border-radius:20px;
            font-weight:bold;
        }

        .delete-btn{
            display:inline-flex;
            align-items:center;
            gap:6px;
            background:#fff;
            color:#ef4444;
            padding:8px 14px;
            border-radius:10px;
            text-decoration:none;
            font-size:14px;
            font-weight:600;
            transition:0.3s;
        }

         .delete-btn:hover{
            background:#ef4444;
            color:#fff;
        }

        .search-btn{
    background:#fff;
    color:#2563eb;
    border:2px solid #2563ebe;
    padding:10px 20px;
    border-radius:10px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.search-btn:hover{
    background:#2563eb;
    color:#fff;
}

.download-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#fff;
    color:#16a34a;
    border:2px solid #16a34a;
    text-decoration:none;
    padding:10px 18px;
    border-radius:10px;
    font-weight:600;
    transition:.3s;
}

.download-btn:hover{
    background:#16a34a;
    color:#fff;
}

.logout-section{
    position:absolute;
    bottom:25px;
    left:0;
    width:100%;
}

.logout-btn{
    display:flex;
    align-items:center;
    gap:12px;
    margin:0 15px;
    padding:15px 20px;
    color:white;
    text-decoration:none;
    border-radius:10px;
    transition:.3s;
    font-size:16px;
}

.logout-btn:hover{
    background:#2563eb;
}

#pagination button{
    margin:5px;
    padding:8px 14px;
    border:none;
    border-radius:8px;
    background:#e5e7eb;
    cursor:pointer;
    font-weight:600;
    transition:.3s;
}

#pagination button:hover{
    background:#2563eb;
    color:white;
}

#pagination .active-page{
    background:#2563eb;
    color:white;
}

#pagination button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2 class="logo">
            <i class="fa-solid fa-shield-halved"></i>

            <span>
                Aadhaar Shield
             </span>
        </h2>
       <a href="/index" class="{% if active_page == 'home' %}active{% endif %}">
    <i class="fa-solid fa-house"></i>
    Home
</a>

<a href="/dashboard" class="{% if active_page == 'dashboard' %}active{% endif %}">
    <i class="fa-solid fa-table-columns"></i>
    Dashboard
</a>

<a href="/result" class="{% if active_page == 'result' %}active{% endif %}">
    <i class="fa-solid fa-file-lines"></i>
    Result
</a>

<a href="/analytics" class="{% if active_page == 'analytics' %}active{% endif %}">
    <i class="fa-solid fa-chart-line"></i>
    Analytics
</a>

<a href="/alerts" class="{% if active_page == 'alerts' %}active{% endif %}">
    <i class="fa-solid fa-bell"></i>
    Alerts
</a> 
<div class="logout-section">

    <a href="/login" class="logout-btn">
        <i class="fa-solid fa-right-from-bracket"></i>
        Logout
    </a>

</div>
    </div>

    <!-- Main content -->
    <div class="main">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
