{% extends "base.html" %}

{% block content %}

<h2 style="
text-align:center;
font-size:32px;
margin-bottom:20px;
font-weight:600;
">
    Aadhaar Fraud Detection System
</h2>

<div style="
width:450px;
padding:25px;
background:white;
border-radius:10px;
box-shadow:0px 0px 10px lightgray;
margin:50px auto;
">

<form method="POST" action="/submit">

    <label style="
    font-size:17px;
    color:231e1;
    ">
        Full Name:
    </label><br>

    <input type="text" name="name"
    style="
    width:100%;
    padding:8px;
    font-size:15px;
    box-sizing:border-box;
    "><br><br>

    <label style="
    font-size:17px;
    color:#231e1e;
    ">
        Aadhaar Number:
    </label><br>

    <input type="text" name="aadhaar" maxlength="12"
    style="
    width:100%;
    padding:8px;
    font-size:15px;
    box-sizing:border-box;
    "><br><br>

    <label style="
    font-size:17px;
    color:231e1;
    ">
        Mobile Number:
    </label><br>

    <input type="text" name="mobile" maxlength="10"
    style="
    width:100%;
    padding:8px;
    font-size:15px;
    box-sizing:border-box;
    "><br><br>

    <input type="hidden" name="latitude" id="latitude">
    <input type="hidden" name="longitude" id="longitude">

    <button type="submit"
    style="
    background:#3498db;
    color:white;
    padding:12px 25px;
    font-size:16px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    ">
        Submit
    </button>

</form>

</div>

<script>
if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
        function(position) {
            document.getElementById("latitude").value = position.coords.latitude;
            document.getElementById("longitude").value = position.coords.longitude;
        },
        function(error) {
            alert("Please allow location access.");
        }
    );
}
</script>

{% endblock %}
